<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TF2 Xbox Modding - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="container">
            <h1>TF2 XBOX MODDING</h1>
            <p>The home for TF2 Xbox 360</p>
            <nav>
                <a href="index.html">Home</a>
                <a href="#about">About</a>
            </nav>
        </div>
    </header>
    
<section class="blog-feed">
    <h2>Latest Blog Posts</h2>

    <!-- Jekyll will loop through your _posts folder here -->
    {% for post in site.posts %}
    <article class="post">
        <h3>{{ post.title }}</h3>
        <span class="date">{{ post.date | date: "%B %d, %Y" }}</span>
        <p>{{ post.excerpt }}</p>
        <a href="{{ post.url }}" class="read-more">Read More &rarr;</a>
    </article>
    {% endfor %}

</section>

    <footer>
        <div class="container">
            <p>&copy; 2026 tf2xboxmodding.com. Not affiliated with Valve Corporation.</p>
        </div>
    </footer>

</body>
</html>
